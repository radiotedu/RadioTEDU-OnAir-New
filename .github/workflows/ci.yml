name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Install FFmpeg tools
        run: choco install ffmpeg --yes --no-progress
      - name: Install Python dependencies
        run: |
          python -m venv .ci-venv
          "$PWD/.ci-venv/Scripts" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          ./.ci-venv/Scripts/python -m pip install --upgrade pip
          ./.ci-venv/Scripts/python -m pip install --only-binary=:all: -r requirements.lock
      - name: Verify Python dependency graph
        run: python -m pip check
      - name: Complete Python regression suite
        run: python -m pytest -q --disable-warnings --junitxml=.test-output/pytest.xml
      - name: JavaScript tests
        if: always()
        shell: powershell
        run: |
          Get-ChildItem tests/js/*.test.cjs | ForEach-Object {
            node --test $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "JavaScript test failed: $($_.FullName)" }
          }
      - name: Browser JavaScript syntax
        if: always()
        shell: powershell
        run: |
          Get-ChildItem app/static -Recurse -Filter *.js | ForEach-Object {
            node --check $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "JavaScript syntax check failed: $($_.FullName)" }
          }
      - name: Desktop lifecycle tests
        if: always()
        run: dotnet test desktop/CleanroomRadio.Desktop.sln --configuration Release --verbosity minimal
      - name: Retain full regression results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-regression-junit
          path: .test-output/pytest.xml
          if-no-files-found: warn
