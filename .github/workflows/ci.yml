name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Install FFmpeg tools
        run: choco install ffmpeg --yes --no-progress
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --only-binary=:all: -r requirements.lock
      - name: Verify Python dependency graph
        run: python -m pip check
      - name: Broadcast, service, and repository acceptance suite
        run: |
          python -m pytest -q --disable-warnings `
            tests/unit/test_quality_outputs.py `
            tests/unit/test_multi_quality_runtime.py `
            tests/unit/test_quality_compliance_variants.py `
            tests/unit/test_quality_output_bridge.py `
            tests/unit/test_station_output_repo.py `
            tests/unit/test_station_output_api.py `
            tests/unit/test_setup_onboarding_api.py `
            tests/unit/test_streaming_credentials.py `
            tests/unit/test_startup_runtime_autostart.py `
            tests/unit/test_process_isolated_station_runtime.py `
            tests/unit/test_radio_backend_service_runner.py `
            tests/unit/test_radiotedu_service_control.py `
            tests/unit/test_readme_commands.py `
            tests/unit/test_readme_foundation_commands.py `
            tests/unit/test_readme_installer_section.py `
            tests/unit/test_readme_parity_runtime_md.py `
            tests/unit/test_runtime_launcher_contract.py `
            tests/unit/test_frontend_api_route_coverage.py `
            tests/unit/test_installer_contract.py `
            tests/unit/test_installer_data_acl.py `
            tests/integration/test_process_station_worker_lifecycle.py `
            tests/integration/test_station_worker_runtime_integration.py `
            tests/integration/test_multi_station_output_runtime.py `
            tests/integration/test_station_output_api_persistence.py `
            tests/test_broadcast_queue_autofill_durability.py
      - name: JavaScript tests
        shell: powershell
        run: |
          Get-ChildItem tests/js/*.test.cjs | ForEach-Object {
            node --test $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "JavaScript test failed: $($_.FullName)" }
          }
      - name: Browser JavaScript syntax
        shell: powershell
        run: |
          Get-ChildItem app/static -Recurse -Filter *.js | ForEach-Object {
            node --check $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "JavaScript syntax check failed: $($_.FullName)" }
          }
      - name: Desktop lifecycle tests
        run: dotnet test desktop/CleanroomRadio.Desktop.sln --configuration Release --verbosity minimal
