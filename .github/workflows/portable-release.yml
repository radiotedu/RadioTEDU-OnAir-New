name: portable-release

on:
  workflow_dispatch:
  push:
    tags: ['v*']
    branches: ['live-microphone-platform-release']

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install locked dependencies and packaging tools
        run: python -m pip install -r requirements.lock pyinstaller==6.16.0
      - name: Verify core audio and portable credential contracts
        run: python -m pytest -q tests/unit/test_native_pcm_session.py tests/unit/test_broadcast_mixer_quality.py tests/unit/test_managed_folder_scan_safety.py tests/unit/test_live_folder_queue_updates.py tests/unit/test_portable_credentials.py tests/unit/test_portable_launcher.py tests/unit/test_runtime_paths.py tests/unit/test_audio_transitions_api.py tests/unit/test_audio_live_render_api.py tests/unit/test_device_discovery.py tests/unit/test_gst_pipeline_builder.py
      - name: Verify browser state transitions
        shell: bash
        run: node --test --test-concurrency=1 tests/js/*.test.cjs
      - name: Build portable browser-based app
        shell: bash
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --name RadioTEDU-OnAir \
            --add-data 'VERSION:.' \
            --add-data 'app/static:app/static' \
            --collect-submodules app --collect-submodules uvicorn --collect-submodules passlib \
            --collect-data certifi onair_portable.py
      - name: Verify packaged startup without creating a station
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            executable=dist/RadioTEDU-OnAir/RadioTEDU-OnAir.exe
          else
            executable=dist/RadioTEDU-OnAir/RadioTEDU-OnAir
          fi
          "$executable" --help
      - name: Upload portable setup artifact
        run: python installer/package_portable.py dist/RadioTEDU-OnAir --output release --platform ${{ runner.os }} --arch ${{ runner.arch }}
      - name: Upload portable archive
        uses: actions/upload-artifact@v4
        with:
          name: RadioTEDU-OnAir-${{ runner.os }}-${{ runner.arch }}
          path: |
            release/*.zip
            release/*.tar.gz
          if-no-files-found: error
